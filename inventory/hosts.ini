;
; Ansible Inventory (INI format) — Cisco Catalyst 9800 WLC Fleet
;
; Usage:
;   ansible-playbook -i inventory/hosts.ini playbooks/<playbook>.yml
;
; Prefer hosts.yml for new deployments — this INI version is provided for
; tools and pipelines that expect INI-format inventories.
; =============================================================================

[wlc_hq]
wlc-hq-01 ansible_host=192.168.10.1 site_tag_name=Site-Typical-Density

[wlc_hq:vars]
site_density=typical
ansible_network_os=cisco.ios.ios
ansible_connection=network_cli
ansible_user=admin

[wlc_branch]
wlc-branch-01 ansible_host=10.10.1.1 site_tag_name=Site-Low-Density-Flex
wlc-branch-02 ansible_host=10.10.2.1 site_tag_name=Site-Low-Density-Flex

[wlc_branch:vars]
site_density=low
ansible_network_os=cisco.ios.ios
ansible_connection=network_cli
ansible_user=admin

[wlc_high_density]
wlc-venue-01 ansible_host=172.16.5.1 site_tag_name=Site-High-Density
wlc-venue-02 ansible_host=172.16.6.1 site_tag_name=Site-High-Density-Central

[wlc_high_density:vars]
site_density=high
ansible_network_os=cisco.ios.ios
ansible_connection=network_cli
ansible_user=admin

[wlc_lab]
wlc-lab-01 ansible_host=192.168.1.1 site_tag_name=Site-Typical-Density

[wlc_lab:vars]
site_density=typical
ansible_network_os=cisco.ios.ios
ansible_connection=network_cli
ansible_user=admin

[all:vars]
; Store passwords in ANSIBLE_NET_PASSWORD env var or ansible-vault — never here
