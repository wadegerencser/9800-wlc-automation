#
# Validate – Ansible Lint + Terraform Validate
#
# Runs on every PR and push to main. Validates:
#   • Ansible playbooks (ansible-lint)
#   • Terraform modules (terraform fmt -check + terraform validate)
#   • YAML syntax (yamllint)
#
# Compatible with:
#   macOS / Linux runners (GitHub-hosted ubuntu-latest)
#   Windows (runs on ubuntu-latest — no Windows runner needed for linting)
#   Android / iOS / NPC: trigger via GitHub mobile app or any browser
#     that can post to the GitHub API to kick off a workflow_dispatch run.
# =============================================================================

name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:      # manual trigger from GitHub UI / mobile / API

jobs:

  # ── YAML lint ───────────────────────────────────────────────────────────────
  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint all YAML files
        run: |
          yamllint -d '{
            extends: default,
            rules: {
              line-length: {max: 120},
              comments: disable,
              truthy: disable
            }
          }' playbooks/ vars/

  # ── Ansible lint ────────────────────────────────────────────────────────────
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    needs: yamllint
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible + collections
        run: |
          pip install ansible ansible-lint
          ansible-galaxy collection install cisco.ios cisco.iosxe

      - name: Run ansible-lint (playbooks/)
        run: |
          ansible-lint \
            --exclude=.github \
            --warn-list=yaml \
            playbooks/

  # ── Terraform validate ──────────────────────────────────────────────────────
  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - terraform/site_tag_9800
          - terraform/site_tag_density_9800
          - terraform/rf_profile_harden_9800
          - terraform/ap_join_profile_9800
          - terraform/stig_harden_9800
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"

      - name: Terraform fmt check — ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: terraform fmt -check -recursive

      - name: Terraform init — ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: terraform init -backend=false

      - name: Terraform validate — ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: terraform validate
        env:
          # Provide dummy values so validate doesn't error on required vars
          TF_VAR_wlc_host:     "192.0.2.1"
          TF_VAR_wlc_username: "admin"
          TF_VAR_wlc_password: "validate-only"
