---
# Ansible Inventory — Cisco Catalyst 9800 WLC Fleet
#
# Copy to inventory/hosts.yml and fill in your WLC IPs/hostnames.
# Store credentials in ansible-vault or environment variables — never plaintext.
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml playbooks/<playbook>.yml
#
# Quick-start (all platforms):
#   macOS / Linux : ansible-playbook -i inventory/hosts.yml playbooks/site_tag_density_9800.yml
#   Windows WSL 2 : same command from WSL shell
#   AAP / AWX     : import this inventory file via the UI — works from any browser
# =============================================================================

all:
  vars:
    ansible_network_os:  cisco.ios.ios
    ansible_connection:  network_cli
    ansible_user:        admin
    # ansible_password:  Use ANSIBLE_NET_PASSWORD env var or ansible-vault

  children:

    # ── Headquarters WLCs ─────────────────────────────────────────────────────
    wlc_hq:
      vars:
        site_density: typical     # low | typical | high — used by density playbooks
      hosts:
        wlc-hq-01:
          ansible_host: 192.168.10.1
          site_tag_name: Site-Typical-Density

    # ── Branch WLCs (FlexConnect) ─────────────────────────────────────────────
    wlc_branch:
      vars:
        site_density: low
      hosts:
        wlc-branch-01:
          ansible_host: 10.10.1.1
          site_tag_name: Site-Low-Density-Flex
        wlc-branch-02:
          ansible_host: 10.10.2.1
          site_tag_name: Site-Low-Density-Flex

    # ── High-density venues ───────────────────────────────────────────────────
    wlc_high_density:
      vars:
        site_density: high
      hosts:
        wlc-venue-01:
          ansible_host: 172.16.5.1
          site_tag_name: Site-High-Density
        wlc-venue-02:
          ansible_host: 172.16.6.1
          site_tag_name: Site-High-Density-Central

    # ── Lab / development WLCs ────────────────────────────────────────────────
    wlc_lab:
      vars:
        site_density: typical
      hosts:
        wlc-lab-01:
          ansible_host: 192.168.1.1
          site_tag_name: Site-Typical-Density
